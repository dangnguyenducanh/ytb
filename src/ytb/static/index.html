<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ytb — YouTube summarizer</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1db;
    --accent: #c4302b; --accent-ink: #ffffff; --err-bg: #fdecea; --err-ink: #8a1c17;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --card: #1e1e1c; --ink: #ecebe6; --muted: #a09e97; --line: #33322f;
            --err-bg: #3a1a18; --err-ink: #ffb4ab; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  .badge { font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input, textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bg);
                    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  textarea { min-height: 160px; resize: vertical; margin-top: 8px; }
  details { margin-top: 14px; color: var(--muted); }
  details summary { cursor: pointer; }
  .row { display: flex; align-items: center; gap: 14px; margin-top: 16px; flex-wrap: wrap; }
  button { font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-ink); border: 0;
           border-radius: 10px; padding: 10px 22px; cursor: pointer; }
  button:disabled { opacity: .55; cursor: progress; }
  #status { color: var(--muted); font-size: 14px; }
  #error { margin-top: 18px; background: var(--err-bg); color: var(--err-ink); border-radius: 12px; padding: 14px 16px; }
  #result { margin-top: 18px; }
  #result h2 { margin: 0 0 8px; font-size: 18px; }
  #summary { margin: 0 0 16px; white-space: pre-wrap; }
  #stats { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0;
           font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
  #stats dt { font-weight: 600; }
  #stats dd { margin: 0; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <header>
    <h1><span>▶</span> ytb summarizer</h1>
    <div class="badge">model: <span id="model">loading…</span></div>
  </header>

  <form id="form" class="card" autocomplete="off">
    <label for="url">YouTube link</label>
    <input id="url" name="url" placeholder="youtube.com/watch?v=… or youtu.be/…">
    <details id="paste">
      <summary>Paste text instead</summary>
      <textarea id="text" name="text" placeholder="Paste a transcript or article to summarize"></textarea>
    </details>
    <div class="row">
      <button id="go" type="submit">Summarize</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
  </form>

  <div id="error" role="alert" hidden></div>

  <section id="result" class="card" hidden>
    <h2>Summary</h2>
    <p id="summary"></p>
    <dl id="stats"></dl>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const PREFIX = {
    422: "Check the link or text",
    404: "No captions or audio for this video",
    413: "Too long (max 150,000 characters, or 60 minutes for videos without captions)",
    503: "YouTube is rate-limiting this machine, try again later",
  };
  const SOURCE = { captions: "captions", whisper: "local transcription" };

  fetch("/api/health").then((r) => r.json())
    .then((h) => { $("model").textContent = h.model; })
    .catch(() => { $("model").textContent = "backend offline"; });

  function showStats(d) {
    const rows = [
      ["Video", d.video_id || "—"],
      ["Language", d.language || "—"],
      ["Source", SOURCE[d.source] || "—"],
      ["Chunks", d.chunks],
      ["Tokens", `${d.input_tokens.toLocaleString()} in → ${d.output_tokens.toLocaleString()} out`],
      ["Server time", `${d.seconds} s`],
      ["Model", d.model],
    ];
    $("stats").replaceChildren(...rows.flatMap(([k, v]) => {
      const dt = document.createElement("dt"); dt.textContent = k;
      const dd = document.createElement("dd"); dd.textContent = v;
      return [dt, dd];
    }));
  }

  $("form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const url = $("url").value.trim();
    const text = $("text").value.trim();
    const body = {};
    if (url) body.url = url;
    if (text) body.text = text;

    $("result").hidden = true;
    $("error").hidden = true;
    $("go").disabled = true;
    const t0 = performance.now();
    const secs = () => ((performance.now() - t0) / 1000).toFixed(0);
    const tick = () => {
      $("status").textContent = `Working… ${secs()} s · videos without captions are transcribed locally — this can take a few minutes`;
    };
    tick();
    const timer = setInterval(tick, 500);
    try {
      const r = await fetch("/api/summarize", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) {
        const detail = typeof data.detail === "string" ? data.detail : "The request was not valid.";
        $("error").textContent = `${PREFIX[r.status] || "Something went wrong"}: ${detail}`;
        $("error").hidden = false;
        $("status").textContent = "";
        return;
      }
      $("summary").textContent = data.summary;
      showStats(data);
      $("result").hidden = false;
      $("status").textContent = `Done in ${secs()} s`;
    } catch (e) {
      $("error").textContent = "Cannot reach the backend. Is the server running?";
      $("error").hidden = false;
      $("status").textContent = "";
    } finally {
      clearInterval(timer);
      $("go").disabled = false;
    }
  });
</script>
</body>
</html>
